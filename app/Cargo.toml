[package]
name = "gonedark-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The DESKTOP host: a thin `winit` 0.30 run loop that drives the shared `engine::Game`
# (sim + render + fixed-tick + cameras + input). The platform-agnostic loop lives in
# `engine`; this crate only owns the window, the desktop wgpu surface, and input plumbing.
# `winit`/`wgpu` are fine here — invariant #2 only keeps GPU/windowing out of `core` and the
# abstract `pal` trait crate. (Android does NOT use this binary; its entry is `android_main`
# in `pal-android`, which drives the same `engine::Game`.)
# Real desktop audio output is ON BY DEFAULT (forwards to pal-desktop's `audio` feature, which pulls
# cpal). Audio is a PRIMARY system — the world goes dark and you fight by sound (invariant #6) — so a
# stock `cargo run -p gonedark-app` / `pnpm play` must have sound, not silence. The tradeoff: cpal
# links the OS audio API, which on Linux needs the ALSA dev headers (`libasound2-dev` /
# `alsa-lib-devel`); macOS (CoreAudio) and Windows (WASAPI) need none. A headless / no-audio-headers
# build (CI runners, servers) opts OUT with `cargo run -p gonedark-app --no-default-features`
# (`pnpm play:silent`), which links the silent no-op sink. The sim/checksum runners
# (sim-runner/net-sim-runner/replay-runner) depend only on `core` and never pull this, so they stay
# audio-free and deterministic regardless (invariant #8's clone-and-run still holds for them).
[features]
default = ["audio"]
audio = ["gonedark-pal-desktop/audio"]

[dependencies]
gonedark-engine = { path = "../engine" }
gonedark-pal = { path = "../pal" }
# The Operations-hub campaign model + its read DTOs (`core::campaign`, re-exported through
# `core::shell`) the out-of-match shell drives the PvE mission-select / briefing surfaces from
# (PvE WS-B, D58). `core` is the GPU-free, platform-free shared crate (invariant #2), so a host
# shell depending on it for presentation DTOs is within bounds — exactly as it reads the gunsmith
# loadout model. The mission *registry* (`MissionId -> runnable mission`) lives in `engine`.
gonedark-core = { path = "../core" }
winit = "0.30"
wgpu = "30"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
gonedark-pal-desktop = { path = "../pal-desktop" }

# The desktop app shell (D32: out-of-match surfaces are native per-platform; D36 picks egui as the
# desktop toolkit — the call D32 left open). egui renders through the SAME wgpu 29 device + winit 0.30
# window this binary already owns (one wgpu in the dep tree — verified), so the title screen is
# host-side chrome with no second window/event path. Desktop-only (the app bin is never built for
# android — its entry is `android_main`), so these sit under the not-android target alongside
# pal-desktop. The shell holds no game logic; it drives the shared engine the same way the Android
# Compose shell (D35) does (invariant #2).
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"

# The live 3D title backdrop the egui title screen composites over (`gonedark_render::title_backdrop`).
# A direct host-side dep on `render` for out-of-match presentation — `app` is the platform shell, not
# `core`, so this is within invariant #2 (and `app` already pulls `render` transitively via `engine`).
# This is also why the colour table in `shell.rs` no longer needs the old "mirror the hex, don't take
# a dep just for colours" justification — the dep now exists for the backdrop regardless.
gonedark-render = { path = "../render" }

# Android does NOT share this desktop run loop: its entry point is `android_main` in
# `pal-android`, built directly by cargo-ndk into a `.so`. The shared android run-loop
# wiring is Phase 2; for now `app` stays a desktop binary and this dep is only here so a
# `cargo build --target aarch64-linux-android` of the workspace still resolves the host.
[target.'cfg(target_os = "android")'.dependencies]
gonedark-pal-android = { path = "../pal-android" }

# Dev-only: the headless shell-screenshot harness (`shell::shot`, an #[ignore]d test) renders each
# out-of-match screen to a PNG offscreen so the egui layout can be eyeballed without a window. Mirrors
# the `viz-runner` readback path (pollster-blocked device, png readback). Not shipped in the binary.
[dev-dependencies]
pollster = "0.4"
png = "0.17"
