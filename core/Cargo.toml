[package]
name = "gonedark-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# NO build script (D108): the trig LUTs are checked-in integer source
# (`src/lut_data.rs`), not baked at build time — build-time baking trusted the host's
# libm, which is not bit-identical across build hosts. `build/lut.rs` is retained only
# as the offline regeneration tool. Do not re-add `build = ...` here.

# INVARIANT #2 (D9): the deterministic core depends on NO platform/windowing/GPU crate
# and NO float-using crate. This dependency list must stay empty (or contain only
# audited, float-free, deterministic crates). A `wgpu`/`winit`/`libm` entry here is a
# bug. INVARIANT #1: there are no `f32`/`f64` tokens anywhere in `core/src` — floats are
# structurally impossible in the sim, not merely discouraged. (The offline LUT
# regeneration tool under `build/` uses f64 on the host; its committed output is pure
# integer data, hash-locked by a test, and never executes inside the sim.)
[dependencies]

[dev-dependencies]
